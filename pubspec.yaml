name: untitled
description: "PuffTrack - умный трекер затяжек и привычек."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.12.2
  google_mlkit_face_detection: ^1.0.3
  google_mlkit_pose_detection: ^1.0.3
  supabase_flutter: ^2.18.3
  shared_preferences: ^2.5.6
  record: ^7.2.0
  delightful_toast: ^1.1.0
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/devices/
    - assets/images/mascot/
    - assets/images/icons/
    - assets/audio/